<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <title>route</title>
    <link rel="icon" type="image/svg+xml" href="/meeroute/favicon.svg" />
    <meta name="theme-color" content="#eef4fc" />

    <!--
      Обязателен и должен грузиться с telegram.org: SDK Mini App не
      публикуется в npm, а window.Telegram.WebApp появляется только после
      него. Синхронный, до бандла — иначе первый кадр отрисуется раньше,
      чем мы узнаем тему и высоту вьюпорта, и экран моргнёт.
    -->
    <script src="https://telegram.org/js/telegram-web-app.js?58"></script>

    <!--
      Тема — до первого байта стилей.

      `src/theme.ts` ставит тот же атрибут, но модуль выполняется после
      разбора головы: между отрисовкой фона и запуском бандла успевает
      мигнуть светлый экран. У ночной темы это заметно, и заметно именно
      на запуске, который человек видит каждый день.

      Скрипт нарочно повторяет логику `initialTheme()` в трёх строках, а
      не импортирует её: любой импорт здесь — это ещё один запрос до
      первого кадра, ровно та цена, которой мы избегали шрифтами.

      Стоит после SDK Telegram и до стилей: раньше — и `colorScheme`
      клиента ещё неоткуда взять, позже — и светлый фон успеет мигнуть.
    -->
    <script>
      try {
        var t = localStorage.getItem('route.theme');
        if (t !== 'light' && t !== 'dark' && t !== 'dark2') {
          var c = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.colorScheme;
          t = (c || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark' ? 'dark' : 'light';
        }
        if (t !== 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        /* Хранилище закрыто настройками webview — останется светлая. */
      }
    </script>

    <!--
      Шрифт свой, а не с fonts.googleapis.com: там это два обращения к
      чужим доменам до первого текста. Начертания подрезаны до кириллицы
      и латиницы (`scripts/prepare-fonts.py`) — 25 КБ вместо 190.

      Заранее просим два файла из четырёх: обычный текст и переменный,
      на котором заголовки и вес 600. Medium и Bold встречаются ниже
      первого экрана и подождут своей очереди.
    -->
    <link rel="preload" href="/meeroute/fonts/YSText-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/meeroute/fonts/YSText-VF.woff2" as="font" type="font/woff2" crossorigin />
    <script type="module" crossorigin src="/meeroute/assets/index-DY6FRoWN.js"></script>
    <link rel="stylesheet" crossorigin href="/meeroute/assets/index-Bnt_qGTO.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
